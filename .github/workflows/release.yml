name: release

# The descriptor is the release request. Adding releases/vX.Y.Z.yaml in a pull
# request proposes a release; merging it to main cuts one. See
# spec/release-format.md.
#
# Nothing here depends on a local credential's ref scope: the runner's
# GITHUB_TOKEN carries contents: write, which covers refs/tags/*.
#
# Descriptors whose version already has a tag are skipped, so re-running this,
# or merging an unrelated change under releases/, is a no-op.

on:
  push:
    branches: [main]
    paths:
      - 'releases/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — run every gate, create nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Which descriptors are valid, and which of them have no tag yet?
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.pending.outputs.versions }}
      count: ${{ steps.pending.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Validate every descriptor against spec/release-format.md
        run: python3 scripts/validate-releases.py releases/

      - name: Find descriptors with no tag
        id: pending
        run: |
          set -euo pipefail
          # JSON on stdout, the human-readable roll-call on stderr, so neither
          # depends on the other's line count.
          python3 - > pending.json <<'PY'
          import json, pathlib, subprocess, sys, yaml

          tags = set(subprocess.run(
              ["git", "tag", "--list"], capture_output=True, text=True, check=True
          ).stdout.split())

          out = []
          for p in sorted(pathlib.Path("releases").glob("*.yaml")):
              with open(p, encoding="utf-8") as fh:
                  version = yaml.safe_load(fh)["version"]
              if version in tags:
                  print(f"  cut already   {version}", file=sys.stderr)
              else:
                  print(f"  PENDING       {version}", file=sys.stderr)
                  out.append(version)
          json.dump(out, sys.stdout)
          PY

          versions=$(cat pending.json)
          count=$(python3 -c 'import json,sys; print(len(json.load(open("pending.json"))))')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "pending: $count -> $versions"

      - name: Nothing to cut
        if: steps.pending.outputs.count == '0'
        run: |
          echo "### No pending releases — every descriptor already has its tag" \
            >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # One job per pending release, so each gets its own log and its own gates.
  # ---------------------------------------------------------------------------
  cut:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.plan.outputs.pending) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Read the descriptor
        id: desc
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import os, yaml

          version = os.environ["VERSION"]
          with open(f"releases/{version}.yaml", encoding="utf-8") as fh:
              d = yaml.safe_load(fh)

          # commit is optional: omitted means "wherever this descriptor landed",
          # which is the only value a pull request cannot know about itself.
          print("commit=%s" % (d.get("commit") or "").strip())
          print("title=%s" % d["title"].strip())
          print("draft=%s" % str(bool(d.get("draft"))).lower())
          print("prerelease=%s" % str(bool(d.get("prerelease"))).lower())

          # Multi-line, so it goes out as a heredoc-delimited output.
          print("notes<<__NOTES_EOF__")
          print(d["summary"].strip())
          print("__NOTES_EOF__")
          PY

      - name: Resolve and guard
        id: resolve
        env:
          VERSION: ${{ matrix.version }}
          COMMIT: ${{ steps.desc.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists — versions are never reused"
            exit 1
          fi

          target="${COMMIT:-${{ github.sha }}}"
          if ! sha=$(git rev-parse --verify --quiet "${target}^{commit}"); then
            echo "::error::$VERSION pins '$target', which is not a commit here"
            exit 1
          fi

          # A release must never pin canon the default branch does not carry.
          if ! git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$sha is not an ancestor of origin/$DEFAULT_BRANCH"
            exit 1
          fi

          prev=$(git describe --tags --abbrev=0 "$sha" 2>/dev/null || echo "")
          {
            echo "sha=$sha"
            echo "prev=$prev"
          } >> "$GITHUB_OUTPUT"

          echo "$VERSION -> $sha  (previous tag: ${prev:-none})"
          git log -1 --format='  %h %an  %s' "$sha"

      # spec/release-format.md §4 rule 7: the merged head must be the ratified
      # head plus at most the descriptor. Format 1 descriptors are unguarded and
      # pass; format 2 descriptors fail the cut here if the head moved.
      - name: Gate — release-head guard
        env:
          VERSION: ${{ matrix.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: python3 scripts/check-release-head.py "releases/$VERSION.yaml" --at "$SHA"

      - name: Check out the commit under release
        run: git checkout --detach ${{ steps.resolve.outputs.sha }}

      # ---- canon gates (CLAUDE.md), at the commit being tagged ---------------
      # The descriptor may pin an older commit, so the gates run against that
      # tree, not against the tip that happens to carry the descriptor.

      - name: Gate — core ordering + transclusion (exit 0, zero W4)
        run: |
          set -euo pipefail
          out=$(python3 validate-core-order.py core/)
          echo "$out"
          if echo "$out" | grep -q ' W4 '; then
            echo "::error::W4 migration-gap warnings present"
            exit 1
          fi

      - name: Gate — claim schema
        run: python3 scripts/validate-claims.py core/claims/

      - name: Gate — decision schema
        run: python3 scripts/validate-claims.py core/decisions/ --decisions

      - name: Gate — assets reproduce
        run: |
          set -euo pipefail
          # "A claim whose computation fails demotes until fixed" — so a release
          # whose computations fail does not get cut.
          fail=0
          for f in core/assets/*.py; do
            if timeout 300 python3 "$f" >/dev/null 2>&1; then
              echo "  ok    $f"
            else
              echo "  FAIL  $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::an asset failed to reproduce"; exit 1; }

      # ---- notes -------------------------------------------------------------

      - name: Assemble release notes
        env:
          NOTES: ${{ steps.desc.outputs.notes }}
          VERSION: ${{ matrix.version }}
          PREV: ${{ steps.resolve.outputs.prev }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > notes.md
          if [ -n "$PREV" ]; then
            printf '\n\n---\n\n**Full diff:** [%s...%s](%s/compare/%s...%s)\n' \
              "$PREV" "$VERSION" "$REPO_URL" "$PREV" "$VERSION" >> notes.md
          fi
          echo "--- notes.md ---"
          cat notes.md

      # ---- cut ---------------------------------------------------------------

      - name: Dry run — stop here
        if: inputs.dry_run
        env:
          VERSION: ${{ matrix.version }}
          TITLE: ${{ steps.desc.outputs.title }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          {
            echo "### Dry run \`$VERSION\` — gates passed, nothing created"
            echo
            echo "- Commit: \`$SHA\`"
            echo "- Message: $VERSION — $TITLE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push the annotated tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ matrix.version }}
          TITLE: ${{ steps.desc.outputs.title }}
          SHA: ${{ steps.resolve.outputs.sha }}
          # Tagger identity, matching v5.0.0..v5.4.0.
          TAGGER_NAME: 'Emil Klein -  Claude Code AI'
          TAGGER_EMAIL: 'emk@delegate.dk'
        run: |
          set -euo pipefail
          git config user.name "$TAGGER_NAME"
          git config user.email "$TAGGER_EMAIL"
          git tag -a "$VERSION" "$SHA" -m "$VERSION — $TITLE"
          git push origin "refs/tags/$VERSION"

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
          TITLE: ${{ steps.desc.outputs.title }}
          DRAFT: ${{ steps.desc.outputs.draft }}
          PRERELEASE: ${{ steps.desc.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "$VERSION — $TITLE" --notes-file notes.md --verify-tag)
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ matrix.version }}
          TITLE: ${{ steps.desc.outputs.title }}
          SHA: ${{ steps.resolve.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "### Released \`$VERSION\`"
            echo
            echo "- Tag: [\`$VERSION\`]($REPO_URL/releases/tag/$VERSION)"
            echo "- Commit: \`$SHA\`"
            echo "- Message: $VERSION — $TITLE"
          } >> "$GITHUB_STEP_SUMMARY"
