# core/graph/terms.yaml — canonical term registry (format v1)
# Generated from each doc's ddd:contract establishes list during the repo split; canonical_md
# blocks adopted from Emil's ratified proposals (batch in meta/CANON-PATCH-REGISTER.md).
# Five terms are registry-only (no canonical_md): demand, governing-decision, assurance-tower,
# verdict-entropy, immune-system — nothing pins their exact wording.
#
# Edit canonical_md HERE, never in the doc; the doc embeds it byte-for-byte (E6 checks the match).

format: terms/v1
terms:

  - id: term:determination
    term: determination
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > **Determination** is the resolving of a decision against ground — by a rule, a check, or an
      > actor in the moment. Nothing else resolves anything.
  - id: term:decision
    term: decision
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > **Decisions** — the things determined.
  - id: term:ground
    term: ground
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > **Ground** — what they are determined against.
  - id: term:tolerance
    term: tolerance
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > **Tolerance** is the declared boundary of acceptable outcome deviation. It indexes
      > everything: a choice is a governing decision, and a fact is ground, only relative to a
      > declared tolerance. Without one, the decision set is not well-formed.
  - id: term:admission-test
    term: admission-test
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > **A choice is a decision iff varying *the choice* moves the outcome past tolerance.**
      >
      > **A fact is ground iff varying *the world* moves the outcome past tolerance.**
  - id: term:actor
    term: actor
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > An **actor** is a system that resolves decisions by reading ground: variation in declared
      > ground can alter the resolution through an internal pathway that selects among
      > alternatives. A thermostat qualifies; a falling rock does not. Actorhood does not require
      > intelligence.
  - id: term:arrangement
    term: arrangement
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > The **arrangement** is the composition through which a resolution is produced and governed:
      > executor, prior commitments, ground channels, checks, reviewers, record, and accountable
      > principal. The unit of comparison is the arrangement, not the isolated actor.
  - id: term:last-decision
    term: last-decision
    aliases: [last decision in the chain]
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > The **last decision in the chain** — the one closest to the world, whose determination is
      > expressed rather than passed on.
  - id: term:act
    term: act
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > The **act** — the bounded episode of determination running from its first governing
      > decision to an expressed outcome; the unit demand is counted in. Derived, not primitive:
      > an act is decisions resolved against ground. Its exact individuation is earned in `09` —
      > one verdict, one act, where the measure exists.
  - id: term:poisoned-ground
    term: poisoned-ground
    aliases: [poisoned ground]
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > **Poisoned ground** — ground that is present but false: the substrate a determination reads has
      > been corrupted, so a correct determiner resolves wrongly with full authority. The logic is
      > sound; the ground is the attack surface. The state it names: **ground that reached the act
      > false** — what arrived is wrong, not missing.
  - id: term:granularity-bound
    term: granularity-bound
    aliases: [granularity bound]
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > The **granularity bound** — the tolerance-indexed criterion fixing which choices enter the
      > governing set: a choice is a governing decision iff varying it moves the outcome past the
      > declared tolerance.
  - id: term:encode-verify-split
    term: encode-verify-split
    aliases: [encode/verify split]
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > The **encode/verify split** — the division of a determination's demand between pre-resolving
      > ground into the encoded store before the act and verifying the residual mechanically after it.
  - id: term:determinable
    term: determinable
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > The **determinable** — an outcome-relevant dimension of variation at the declared
      > tolerance: the object determination resolves, and the dimension of comparability an axis
      > names. Determinateness comes in orders — red → scarlet → this shade — and the declared
      > tolerance names the order at which the framework stops distinguishing.
  - id: term:determinate
    term: determinate
    established_by: 00-primitives.md
    status: settled
    canonical_md: |
      > The **determinate** — one specific way of occupying a determinable: what discharge
      > produces. A determinate is a way of being, not the determinable plus a differentia, and
      > determinates under one determinable are constitutively exclusive at their grain.
  - id: term:demand
    term: demand
    aliases: [determination demand]
    established_by: 01-the-principle.md
    status: settled
  - id: term:conservation
    term: conservation
    aliases: [conservation principle]
    established_by: 01-the-principle.md
    status: settled
    canonical_md: |
      > **For a task at a declared assurance level, and within a fixed decomposition of that task,
      > determination demand is conserved.**
      >
      > Every governing decision gets made. The only choice is **by whom, when, and at what price.**
      > Reduce the demand in one store and it **relocates**; it does not vanish.
  - id: term:store
    term: store
    established_by: 01-the-principle.md
    status: settled
    canonical_md: |
      > **{rule, check, actor, nothing}.** There is no fifth source.
  - id: term:encoded
    term: encoded
    established_by: 01-the-principle.md
    status: settled
    canonical_md: |
      > **Encoded** — a constraint, fixed *before* the act, by a rule. It amortises: cheap to
      > state, **expensive to find**.
  - id: term:mechanical
    term: mechanical
    established_by: 01-the-principle.md
    status: settled
    canonical_md: |
      > **Mechanical** — a criterion, applied *after* the act, by a check. It pays the
      > **executability tax** and is cheap to trust.
  - id: term:judgment
    term: judgment
    established_by: 01-the-principle.md
    status: settled
    canonical_md: |
      > **Judgment** — determined *during* the act, by an actor reading ground, **with an
      > accountable party named**. It does not amortise; it walks out the door.
      >
      > **A judgment allocation naming no accountable party is not an allocation. It is Escaped
      > with an executor attached.**
  - id: term:escape
    term: escape
    aliases: [escaped]
    established_by: 01-the-principle.md
    status: settled
    canonical_md: |
      > **Escaped** — determined *never*, by nobody: decided-by-nobody as a first-class category.
      > Latent defect exposure. **The only forbidden state.**
  - id: term:assurance
    term: assurance
    established_by: 01-the-principle.md
    status: settled
    canonical_md: |
      > **Tolerance** — which outcome deviations are acceptable — and **assurance** — the strength
      > of evidence that tolerance is met. Two systems can share a tolerance and differ in
      > required assurance.
  - id: term:exhaustiveness
    term: exhaustiveness
    established_by: 02-completeness.md
    status: settled
    canonical_md: |
      > Every governing decision is determined by exactly one of: a **rule** (encoded), a **check**
      > (mechanical), an **actor** (judgment), or **nothing** (escaped).
  - id: term:governing-decision
    term: governing-decision
    aliases: [governing decision]
    established_by: 02-completeness.md
    status: settled
  - id: term:acceptance-predicate
    term: acceptance-predicate
    aliases: [acceptance predicate]
    established_by: 03-the-floor.md
    status: settled
    canonical_md: |
      > The **acceptance predicate** is the criterion that settles whether an outcome is
      > acceptable at the declared tolerance. Everything about a task's checkability — and
      > therefore its floor — lives here.
  - id: term:closure
    term: closure
    aliases: [closes, closed, closing]
    established_by: 03-the-floor.md
    status: settled
    canonical_md: |
      **Effective closure, defined.** A predicate is **closed for an arrangement** when the relevant
      ground is observable and adequacy can be evaluated within declared resource, latency, and confidence
      bounds. **Decidable** is reserved for the formal special case.
  - id: term:floor
    term: floor
    aliases: [intrinsic floor]
    established_by: 03-the-floor.md
    status: settled
    canonical_md: |
      The "floor" is the portion of a determination's demand that **cannot be moved off the in-the-moment
      actor** — the residue that no amount of encoding or checking can amortise, that must be paid, per
      run, in judgment.

      > **The intrinsic floor is a property of the acceptance predicate, not of the decision.**
  - id: term:path-degeneracy
    term: path-degeneracy
    aliases: [path degeneracy]
    established_by: 03-the-floor.md
    status: settled
    canonical_md: |
      > Where the floor is zero, *path-degeneracy* makes it *robustly* zero: infinitely many
      > structurally different candidates satisfy the predicate, so no particular path is
      > load-bearing.
  - id: term:pinning-resolution
    term: pinning-resolution
    aliases: [pinning resolution]
    established_by: 04-actors.md
    status: settled
    canonical_md: |
      > Actors differ in **pinning resolution** — how tightly their behaviour can be constrained.
  - id: term:selection
    term: selection
    established_by: 04-actors.md
    status: settled
    canonical_md: |
      > **Selection is verification relocated from the act onto the actor's identity.**
  - id: term:training
    term: training
    established_by: 04-actors.md
    status: settled
    canonical_md: |
      > **Closure decides whether training is *available*. Cost decides the *ratio* when it is.**
      > Training requires a **reliable error signal** — you must be able to tell, and tell soon,
      > whether the output was right.
  - id: term:accountability
    term: accountability
    established_by: 05-accountability.md
    status: settled
    canonical_md: |
      > **Accountability** is a property of the arrangement, not of the executor: attribution of
      > the determination, a persistent answerable party, and a borne consequence. An arrangement
      > missing any of the three has not allocated the decision's consequence.
  - id: term:attribution
    term: attribution
    established_by: 05-accountability.md
    status: settled
    canonical_md: |
      > **Attribution** — provenance-shaped, and therefore checkable: the record connecting the
      > determination to the execution that produced it.
  - id: term:answerability
    term: answerability
    established_by: 05-accountability.md
    status: settled
    canonical_md: |
      > **Answerability** — the obligation to produce the chain: which determinations were made,
      > by whom, against what ground.
  - id: term:liability
    term: liability
    established_by: 05-accountability.md
    status: settled
    canonical_md: |
      > **Liability** — bearing the consequence.
  - id: term:assurance-tower
    term: assurance-tower
    aliases: [assurance tower]
    established_by: 05-accountability.md
    status: settled
  - id: term:seam
    term: seam
    aliases: [seam demand]
    established_by: 06-composition.md
    status: settled
    canonical_md: |
      > The **seam** — the coordination boundary decomposition creates between the parts: splitting a
      > task or an actor manufactures new governing decisions, the ones about how the parts coordinate,
      > that did not exist when the thing was whole.
      >
      > A composite carries the demand of its parts, **plus** the seam demand `S` created *between* them.
  - id: term:seam-identity
    term: seam-identity
    aliases: [seam-demand identity]
    established_by: 06-composition.md
    status: settled
    canonical_md: |
      > **|D_comp| = |D_single| + |S|**
  - id: term:composite-actor
    term: composite-actor
    aliases: [composite actor]
    established_by: 06-composition.md
    status: settled
    canonical_md: |
      > A **composite actor** — several actors read as one at a declared boundary: from outside it the
      > composite is **one actor**, with one capability envelope and one verdict owed.
      >
      > **A composite actor carries its members' demand, plus the seam demand between them.**
  - id: term:seam-occupancy
    term: seam-occupancy
    aliases: [seam occupancy]
    established_by: 06-composition.md
    status: settled
    canonical_md: |
      > **Seam occupancy** — *who or what sits at the seam*: the allocation of seam demand across
      > the same four stores.
  - id: term:orchestrator
    term: orchestrator
    established_by: 06-composition.md
    status: settled
    canonical_md: |
      > **An actor at the seam** (an orchestrator) carries *judgment* — it handles novelty in the
      > coordination itself. It is expensive every run, and it does not scale.
  - id: term:compound
    term: compound
    established_by: 06-composition.md
    status: settled
    canonical_md: |
      > **The compound** — the loop that harvests recurring seam-judgment into the encoded store over a
      > write-back channel, always paired with a mechanical check on what was harvested, so that each
      > cycle shrinks per-run judgment toward the floor.
  - id: term:determination-intelligence-separation
    term: determination-intelligence-separation
    aliases: [determination is not intelligence]
    established_by: 07-determination-and-intelligence.md
    status: settled
    canonical_md: |
      > **Determination is necessary and nowhere near sufficient for intelligence.**
  - id: term:projection
    term: projection
    established_by: 08-projections.md
    status: settled
    canonical_md: |
      > A **projection** of the principle — the compound drawn on one axis: *pay once, inherit
      > thereafter*, read along **depth** within a run (the funnel) or along **repetition** across runs
      > (maturation).
      >
      > The principle has two projections. They are not two mechanisms. **They are the same
      > mechanism — the compound — run along two different axes.**
  - id: term:funnel
    term: funnel
    established_by: 08-projections.md
    status: settled
    canonical_md: |
      > **The funnel** is the compound over **depth**: pay once at the top, and every decision
      > *below* inherits.
  - id: term:maturation
    term: maturation
    established_by: 08-projections.md
    status: settled
    canonical_md: |
      > **Maturation** is the compound over **repetition**: pay once, and every future *run* is
      > cheaper.
  - id: term:verdict
    term: verdict
    aliases: [verdict function]
    established_by: 09-the-measure.md
    status: settled
    denominations:
      - audience: engineering
        name: specification demand
        note: the measure is identical either way
    canonical_md: |
      > **Definition (determination demand).** For a task whose acceptance predicate **closes** for the
      > arrangement (`term:closure`; *decidable* is the formal special case, not the requirement),
      > the predicate evaluates outcomes, and the **task class** supplies one correct output per
      > input point. The **verdict** is that induced assignment — the correct output over each point
      > of the input space. Let `P` be the distribution over inputs (the *deployment distribution*). The
      > **determination demand** of the task is the Shannon entropy of the verdict:
      >
      > **D = H(verdict)**, measured in **bits**.
      >
      > Where the task class supplies no such assignment, the predicate still evaluates outcomes and
      > there is no verdict to have entropy about — which is the boundary `09` §7 draws.
  - id: term:verdict-entropy
    term: verdict-entropy
    aliases: [verdict entropy]
    established_by: 09-the-measure.md
    status: settled
  - id: term:chain-rule-identification
    term: chain-rule-identification
    established_by: 09-the-measure.md
    status: settled
    canonical_md: |
      > The **chain-rule identification**: conditioning the verdict on any variable `X` splits
      > total demand, exactly, into what `X` encoded — `I(verdict; X)` — and what remains —
      > `H(verdict | X)`. The theorem is Shannon's; the identification is the framework's claim.
  - id: term:act-individuation
    term: act-individuation
    aliases: [act individuation]
    established_by: 09-the-measure.md
    status: settled
    canonical_md: |
      > **Act individuation** — one act = one verdict of the acceptance predicate at the declared
      > boundary, where the predicate's measure exists; batch boundaries are verdict boundaries.
      > The individuation inherits the predicate's discipline and adds no free parameter.
  - id: term:seam-information
    term: seam-information
    aliases: [I(V;S)]
    established_by: 09-the-measure.md
    status: settled
    canonical_md: |
      > **I(verdict ; S)** is **seam demand** — what the *decomposition choice* absorbed.
  - id: term:outcome
    term: outcome
    established_by: 09-the-measure.md
    status: settled
    canonical_md: |
      > The **outcome** — the determinate as it lands in the world, produced at every completed
      > act. The **verdict** is the same determinate as assessed by a declared predicate,
      > produced only where governance has declared one. The world renders outcomes, never
      > verdicts; governance is the conversion of outcomes into verdicts.
  - id: term:capacity
    term: capacity
    established_by: 11-the-floor-mechanism.md
    status: settled
    canonical_md: |
      > An actor's **capacity** is two-fold: **hold capacity** — the bits of ground it can have in
      > context at once — and **resolve capacity** — the bits it can jointly resolve.
  - id: term:overflow
    term: overflow
    established_by: 11-the-floor-mechanism.md
    status: settled
    canonical_md: |
      > **Hold-overflow** — the decision's governing ground exceeds hold capacity. **Resolve-overflow** —
      > the ground fits and is held, but the bits that must be *jointly resolved* exceed resolve
      > capacity.
  - id: term:escape-mechanism
    term: escape-mechanism
    aliases: [overflow ∩ open]
    established_by: 11-the-floor-mechanism.md
    status: settled
    # SCOPE NOTE (filed 2026-08-17, freight session item F-3; flagged by Emil at DDD-dec-15's
    # GATE 2 and carried forward unrepaired since). The open conjunct is ACTOR-INDEXED — "no
    # verifier *the actor holds*" — and is therefore ill-defined, not merely false, where no
    # actor was assigned to the decision at all. On the five ratified no-supplier instances
    # DDD-dec-15 diagnoses, there is no actor whose verifier holdings can be asked about, so the
    # conjunct does not evaluate. This does not affect the mechanism's own region: within it an
    # actor has taken the residual up by construction, and the conjunct is well-formed. It bounds
    # where the mechanism can be ASKED, which is narrower than where it is true. A specimen that
    # will not classify is a datum, not a coding failure — record it as undefined rather than
    # forcing it (meta/b1-reconciliation-2026-08-14.md §5.3).
    #
    # A smaller scope problem of the same family as the one DDD-dec-15 corrected, and NOT
    # resolved here: this note records the limit, it does not re-index the conjunct. The related
    # question of whether capacity is per-actor or per-arrangement is open and is before Emil
    # separately.
    canonical_md: |
      > **Capacity-generated escape — the escape an actor produces from residual it has taken up —
      > requires two conditions, both necessary:**
      >
      > **(1) Overflow** — demand exceeds resolve capacity.
      > **(2) Open** — no verifier the actor holds.
      >
      > Overflow alone (closing predicate) → **retries, not escape.** Recoverable. Not floor.
      > Open alone (within capacity) → **carried by judgment**, where an accountable supplier is
      > named. Not floor. Where none is named, it is escape by another route (`05` §7) — outside
      > this mechanism, not excluded by it.
      > **Overflow AND open** → **escape. This is the floor.**
      >
      > **Sufficient for escape, never necessary.** A governing decision that never entered an
      > actor's residual escapes without overflowing anything: escape is supplied-by-nobody
      > (`term:escape`), and capacity shortfall is one generator of it.
  - id: term:p-err
    term: p-err
    aliases: [p_err]
    established_by: 11-the-floor-mechanism.md
    status: settled
    canonical_md: |
      > `p_err` is **derived** from rate-distortion theory, not assumed — the error rate rises
      > *smoothly* with load.
  - id: term:cost-register
    term: cost-register
    aliases: [cost register]
    established_by: 10-cost.md
    status: settled
  - id: term:standing-cost
    term: standing-cost
    aliases: [standing cost]
    established_by: 10-cost.md
    status: settled
  - id: term:occasioned-cost
    term: occasioned-cost
    aliases: [occasioned cost]
    established_by: 10-cost.md
    status: settled
  - id: term:capability
    term: capability
    established_by: 10-cost.md
    status: settled
    canonical_md: |
      > A **capability** is a typing over an actor's pathways: the class of ground a pathway can
      > read — visual, repository, physical, tool-mediated — and the class of distinctions it can
      > resolve against it. Not a third primitive: it classifies the two primitives' traffic.
  - id: term:ensemble-actor
    term: ensemble-actor
    aliases: [ensemble actor]
    established_by: 12-the-licensing-instance.md
    status: settled
    canonical_md: |
      > **The choice is a property of the ensemble, and it exists nowhere in any member.**
  - id: term:diversity
    term: diversity
    established_by: 12-the-licensing-instance.md
    status: settled
    canonical_md: |
      > **Diversity in a population is how you carry judgment demand that exceeds any single actor's
      > capacity.**
  - id: term:redundancy
    term: redundancy
    established_by: 12-the-licensing-instance.md
    status: settled
    canonical_md: |
      > **Redundancy buys reliability. Diversity buys coverage.**
      >
      > **They are different goods.**
  - id: term:swarm-gate
    term: swarm-gate
    aliases: [the gate on swarms]
    established_by: 12-the-licensing-instance.md
    status: settled
    canonical_md: |
      **A swarm is an actor only if it genuinely determines choices against ground.** The admission
      tests (`00` §4) still gate, and they must.
  - id: term:immune-system
    term: immune-system
    aliases: [immune system]
    established_by: 12-the-licensing-instance.md
    status: settled
  - id: term:delivery
    term: delivery
    aliases: [act-triggered delivery, judgment-mediated delivery, judgement-mediated delivery]
    established_by: 13-delivery.md
    status: draft
    canonical_md: |
      > **Delivery** is how authored governance reaches an act: **act-triggered** — the act triggers
      > retrieval, without judgment — or **judgment-mediated** — it reaches the act only if an actor
      > recalls it. Delivery is a property of a decision **at an act-site**, never of the decision
      > alone: the same decision can be act-triggered at one act-site and judgment-mediated at
      > another, and a path from a decision to an act is act-triggered only if **every** edge on it is.
  - id: term:undelivered
    term: undelivered
    established_by: 13-delivery.md
    status: draft
    canonical_md: |
      > **Undelivered** — filed, adequate, and never reached the act. No source supplied the governing
      > decision at the act, so it was determined by nobody: escape, with a distinguishing feature —
      > **the ledger shows coverage.** Escape that presents as governance.
  - id: term:presumed-discharge
    term: presumed-discharge
    aliases: [presumed discharge]
    established_by: 13-delivery.md
    status: draft
    canonical_md: |
      > **Presumed discharge** — a gate's *pass* meaning never-reached: the artefact recording the
      > skip is identical to the artefact recording the pass. Named as a property of the record, not
      > of an actor's omission, so it stays mechanisable — a discharge ref can be asked whether it
      > distinguishes applied-and-satisfied from never-reached.
  - id: term:commitment-level
    term: commitment-level
    aliases: [commitment level, level of commitment]
    established_by: 14-indexed-determination.md
    status: draft
    canonical_md: |
      > A **commitment level** is a level at which an arrangement fixes behaviour in advance:
      > **outcome-level** — permitted resolutions fixed directly; **policy-level** — the
      > generating procedure fixed; **principal-level** — a determiner selected by qualification
      > and case-level resolution delegated. The three compose, and they are levels of
      > commitment, not species of actor: the question is never which of three kinds an actor
      > is, but at which levels the arrangement has committed.
  - id: term:residual-discretion
    term: residual-discretion
    aliases: [residual discretion]
    established_by: 14-indexed-determination.md
    status: draft
    canonical_md: |
      > **Residual discretion** is the outcome-relevant variation the arrangement's commitments
      > leave open at the act, **held at fixed ground**: the alternatives still admissible once
      > the standing configuration and the ground at the act are both given. It is not variation
      > across ground — a cryptographic hash varies enormously with its input and exercises no
      > discretion, because at each input the commitments fix the output exactly. It is not an
      > observer's inability to predict a fixed policy, which is a fact about the observer and
      > not about the arrangement. And it is not randomness: a deterministic arrangement can
      > carry substantial discretion across unfamiliar cases, a randomised one can be tightly
      > committed, and a zero-variance arrangement can be consistently wrong.
  - id: term:act-address
    term: act-address
    aliases: [act address]
    established_by: 14-indexed-determination.md
    status: draft
    canonical_md: |
      > The **act address** — where an act occurrence sits: its position on declared ground axes and
      > its layer path through the composite acts that contain it, read at the act-site. The occupant
      > is not part of it, so the same address can be occupied by different actors.
