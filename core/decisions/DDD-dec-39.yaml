notes: |
  Filed from the downstream housekeeping session (meta/sessions/2026-10-26-housekeeping/ in
  decision-driven-design), which carries the arrival record per DDD-dec-20; no upstream session
  directory exists, by that convention's scope. Decision ids share one space across the two
  repositories: 39 was the next free id on 2026-10-26 (upstream held up to 37, downstream 38);
  the downstream session decision takes 40.

  The release that carries this decision, v5.15.2, is the guard's first instance: its descriptor
  declares format 2 and names the head of this branch at the commit before the descriptor. If
  Emil rules a change to this pull request before merging, the descriptor is re-committed last
  with the new head, which is the pattern rule 7 prescribes.
