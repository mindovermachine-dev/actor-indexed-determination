notes: |
  Session records: the projection repository's meta/sessions/2026-09-27-act-address/ (the
  design session) and meta/sessions/2026-09-27-act-address-landing/ (the landing, with its
  GATE 1 survey and rulings). The design session ran in chat with no committed arrival record;
  that failure is recorded there (arrival-retroactive.md) on the DDD-dec-17 precedent. The
  pre-registration was fixed and hashed before any case ran (SHA-256 ef34e3bc…f5eb), and that
