format: 1
id: DDD-frame-02
kind: conceptual
statement: |
  Behavioural commitments attach at three levels — outcome, policy, principal — which compose and are not actor species; residual discretion is the outcome-relevant variation those commitments leave open at the act, held at fixed ground.
status: projected
region: engineered arrangements
test: >-
  boundary-case coverage; an arrangement whose commitments resist the three-level coding, or
  whose remaining outcome-relevant variation resists description as residual discretion
owner: none
changed: "v5.10 (2026-08-23, Phase 1a session — residual-discretion clause corrected; quantifier fixed at held ground, declared struck)"
notes: |
